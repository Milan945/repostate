# Publishes a GitHub release for the version in .claude-plugin/plugin.json.
# Runs when that version changes on main (or by hand). If the release
# already exists it does nothing. The tag vX.Y.Z is created on the pushed
# commit, and the release notes are that version's section of CHANGELOG.md.
name: release

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether it is already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} is already released"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.exists.outputs.already == 'false'
        run: |
          python3 - "${{ steps.version.outputs.version }}" > notes.md <<'PY'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## %s\b.*?\n(.*?)(?=^## |\Z)" % re.escape(sys.argv[1]), text, re.S | re.M)
          print((m.group(1).strip() if m else "See CHANGELOG.md.")
                + "\n\n**Install or update:** see the [README](https://github.com/Milan945/repostate#install).")
          PY

      - name: Create the tag and release
        if: steps.exists.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "repostate ${{ steps.version.outputs.tag }}" --notes-file notes.md
