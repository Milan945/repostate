<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repostate</title>
<style>
:root{
  --bg:#F5F6F8;--panel:#FFFFFF;--panel2:#FAFBFC;--line:#E1E4EA;--line2:#EDEFF3;
  --text:#15181E;--text2:#4B5262;--text3:#6B7282;--accent:#2563EB;--accent-fg:var(--accent);--accent-soft:color-mix(in srgb,var(--accent) 12%,#fff);
  --ok:#157F3C;--ok-soft:#E3F4E8;--warn:#9A4A06;--warn-soft:#FDEEDC;--bad:#B42318;--bad-soft:#FDE7E5;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px;color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0F1115;--panel:#171A20;--panel2:#1C2027;--line:#2A2F38;--line2:#232831;
  --text:#ECEEF2;--text2:#B3B9C5;--text3:#8D95A3;--accent-fg:color-mix(in srgb,var(--accent) 55%,#fff);--accent-soft:color-mix(in srgb,var(--accent) 24%,#171A20);
  --ok:#5BD08A;--ok-soft:#173224;--warn:#F2A65A;--warn-soft:#3A2814;--bad:#F87171;--bad-soft:#3B1C1C;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
a{color:var(--accent-fg)}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text3)}
.small{font-size:12px}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 230px;max-width:100%;background:var(--panel2);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.brand{padding:0 10px 14px}
.brand h1{font-size:16px;font-weight:650;letter-spacing:-.01em}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:0 10px;border-radius:8px;color:var(--text2);text-decoration:none}
.nav:hover{background:var(--line2);color:var(--text)}
.nav[aria-current=page]{background:var(--accent-soft);color:var(--accent-fg);font-weight:600}
.nav .count{font-size:12px;color:var(--text3)}
.side-foot{margin-top:auto;padding:16px 10px 0;display:flex;flex-direction:column;gap:6px}
.main{flex:999 1 560px;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.top h2{font-size:22px;font-weight:650;letter-spacing:-.01em}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:0 12px;min-height:36px;cursor:pointer;color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-fg);font-weight:600}
.input,select.input{min-height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px}
.input:focus,.seg button:focus-visible,.btn:focus-visible,.nav:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{min-height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 12px;cursor:pointer}
.btn:hover{border-color:var(--text3)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(var(--min,300px),1fr))}
.grid.fit{grid-template-columns:repeat(auto-fit,minmax(var(--min,300px),1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h3{font-size:15px;font-weight:650;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tile .label{font-size:12px;color:var(--text3)}
.tile .value{font-size:28px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.tile .value small{font-size:14px;font-weight:500;color:var(--text3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;width:100%}
.card:hover{border-color:var(--text3)}
.card .title{font-weight:550;line-height:1.35}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--text2);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent-fg)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.dark{background:var(--text);color:var(--panel)}
.pill.private{background:transparent;border:1px dashed var(--text3);color:var(--text2)}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start}
.col{background:var(--line2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h4{margin:2px 4px 2px;font-size:13px;font-weight:650;display:flex;justify-content:space-between}
.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line2)}
th{border-top:0;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);font-weight:650;white-space:nowrap}
th button{all:unset;cursor:pointer}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
.timeline{display:flex;flex-direction:column;gap:18px}
.day h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin:0 0 8px}
.entry{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}
.entry:first-of-type{border-top:0}
.entry .when{flex:0 0 52px;color:var(--text3)}
.prose{line-height:1.55;color:var(--text2);white-space:normal;overflow-wrap:anywhere}
.prose code{font-family:var(--mono);font-size:12px;background:var(--line2);padding:1px 4px;border-radius:4px}
.empty{padding:40px 20px;text-align:center;color:var(--text3);background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(760px,94vw);max-height:88vh;background:var(--panel);color:var(--text)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.dlg-head{position:sticky;top:0;background:var(--panel);padding:18px 20px 12px;border-bottom:1px solid var(--line2);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.dlg-body{padding:16px 20px 22px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--text3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.linkish{all:unset;color:var(--accent-fg);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);font-weight:650}
.welcome{max-width:640px;margin:8vh auto;display:flex;flex-direction:column;gap:16px}
.welcome pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12px}
.tbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line2);gap:1px;width:100%}
.tbar i{display:block;background:var(--text3);opacity:.4}
.tbar .r-pass,.sq.r-pass{background:var(--ok);opacity:1}
.tbar .r-pass_with_question,.sq.r-pass_with_question{background:repeating-linear-gradient(135deg,var(--ok) 0 3px,var(--ok-soft) 3px 6px);opacity:1}
.tbar .r-fail,.sq.r-fail{background:var(--bad);opacity:1}
.tbar .r-blocked,.sq.r-blocked{background:var(--warn);opacity:1}
.sq{all:unset;display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--line);vertical-align:middle;margin:1px}
button.sq{cursor:pointer}
.sq:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sq.r-not_run{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text3)}
.hbar{position:relative;height:8px;border-radius:4px;background:var(--line2);overflow:hidden;min-width:90px}
.hbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.hbar i.over{background:var(--bad)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{display:flex;flex-direction:column;gap:4px;width:150px;text-decoration:none;color:var(--text2);font-size:11px;overflow-wrap:anywhere}
.thumb img{width:150px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--line2)}
.thumb.missing img{display:none}
.gwrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.gnode{cursor:pointer}
.gnode rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.2}
.gnode.s-done rect{fill:var(--ok-soft);stroke:var(--ok)}
.gnode.s-doing rect{fill:var(--accent-soft);stroke:var(--accent-fg)}
.gnode.s-blocked rect{fill:var(--bad-soft);stroke:var(--bad)}
.gnode.crit rect{stroke-width:3;stroke:var(--text)}
.gnode:focus{outline:none}
.gnode:focus-visible rect{stroke:var(--accent);stroke-width:3}
.gnode text{font:12px var(--sans);fill:var(--text)}
.gnode .gid{font:11px var(--mono);fill:var(--text2)}
.gnode .gst{font:10px var(--sans);fill:var(--text2);text-anchor:end}
.edge{fill:none;stroke:var(--text3);stroke-width:1.2;opacity:.6}
.edge.crit{stroke:var(--text);stroke-width:2.6;opacity:1}
.trow{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line2);cursor:pointer;width:100%}
.trow:hover{background:var(--panel2)}
.trow:focus-visible{outline:2px solid var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;box-shadow:inset 0 0 0 1.5px var(--text3)}
.dot.s-done{background:var(--ok);box-shadow:none}
.dot.s-doing{background:var(--accent);box-shadow:none}
.dot.s-blocked{background:var(--bad);box-shadow:none}
td .linkish{text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:820px){.side{border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px}}
</style>
<script>
try{var t=localStorage.getItem('repostate.theme');var d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;if(d)document.documentElement.dataset.theme='dark'}catch(e){}
</script>
<script src="data.js"></script>
</head>
<body>
<div id="app"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<input id="picker" class="sr" type="file" webkitdirectory multiple aria-label="Choose the .repostate folder">
<script>
(function(){
"use strict";

/* ---------- built-in types (used when the page loads a folder instead of data.js) ---------- */
var BUILTIN = {
  tasks:{prefix:"T",label:"Tasks",view:"board",scope:"team",statuses:["todo","doing","done"],done:["done"]},
  goals:{prefix:"G",label:"Goals",view:"cards",scope:"team",statuses:["active","achieved","dropped"],done:["achieved"]},
  progress:{prefix:"P",label:"Progress",view:"timeline",scope:"team",statuses:[],done:[]},
  decisions:{prefix:"D",label:"Decisions",view:"cards",scope:"team",statuses:["proposed","accepted","superseded","rejected"],done:["accepted"]},
  testcases:{prefix:"TC",label:"Tests",view:"table",scope:"team",statuses:["not_run","pass","pass_with_question","fail","blocked"],done:["pass","pass_with_question"]},
  bugs:{prefix:"B",label:"Bugs",view:"table",scope:"team",statuses:["open","fixing","fixed","wontfix"],done:["fixed","wontfix"]},
  requirements:{prefix:"REQ",label:"Requirements",view:"table",scope:"team",statuses:[],done:[]},
  questions:{prefix:"Q",label:"Open questions",view:"table",scope:"team",statuses:["open","answered"],done:["answered"]},
  reviews:{prefix:"R",label:"Code reviews",view:"list",scope:"personal",statuses:["open","closed"],done:["closed"]},
  notes:{prefix:"N",label:"Notes",view:"list",scope:"personal",statuses:[],done:[]}
};
var ORDER = ["overview","tasks","goals","progress","testcases","bugs","trace","reviews","decisions","evidence","notes"];
var PAGE_LABELS = {overview:"Overview", trace:"Traceability", evidence:"Evidence", decisions:"Decisions"};
var EMBEDDED = {requirements:1, questions:1};
var RES = ["pass","pass_with_question","fail","blocked","not_run"];
var SEV = {blocking:"dark",major:"warn",minor:"",note:""};
var SEV_ORDER = ["blocking","major","minor","note"];

var D = window.REPOSTATE || null;
var app = document.getElementById("app");
var dlg = document.getElementById("dlg");
var ui = load("repostate.ui", {scope:"all", q:"", taskView:"board", reviewBranch:"", showArchived:false, sort:{}});
ui.q = "";

function load(k, dflt){ try{ var v = JSON.parse(localStorage.getItem(k)); return v ? Object.assign({}, dflt, v) : dflt; }catch(e){ return dflt; } }
function save(){ try{ localStorage.setItem("repostate.ui", JSON.stringify(ui)); }catch(e){} }

/* ---------- small helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function titleCase(s){ s = String(s || "").replace(/[_-]+/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); }
function day(iso){ return (iso || "").slice(0, 10); }
function time(iso){ var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
function niceDate(iso){
  var d = new Date(iso); if (isNaN(d)) return esc(iso || "");
  return d.toLocaleDateString([], {day:"numeric", month:"short", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"});
}
function ago(iso){
  var d = new Date(iso); if (isNaN(d)) return "";
  var s = (Date.now() - d) / 1000;
  if (s < 60) return "just now"; if (s < 3600) return Math.round(s/60) + " min ago";
  if (s < 86400) return Math.round(s/3600) + " h ago"; if (s < 86400*30) return Math.round(s/86400) + " d ago";
  return niceDate(iso);
}
function md(text){
  if (!text) return "";
  var lines = esc(text).split(/\n/);
  return lines.map(function(l){
    l = l.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    if (/^\s*[-*] /.test(l)) l = "• " + l.replace(/^\s*[-*] /, "");
    if (/^#{1,6} /.test(l)) l = "<strong>" + l.replace(/^#+ /, "") + "</strong>";
    return l;
  }).join("<br>");
}
function safeColor(c, dflt){ return /^#[0-9a-f]{3,8}$/i.test(c || "") ? c : dflt; }
function label(r){ return r.title || r.summary || r.id; }
function low(x){ return String(x == null ? "" : x).toLowerCase(); }
function push(map, k, v){ (map[k] = map[k] || []).push(v); }
function natural(a, b){ return String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:"base"}); }
function byId(a, b){ return natural(a.id, b.id); }
function trunc(s, n){ s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function hrs(n){ return n == null ? "–" : (Math.round(n * 10) / 10) + " h"; }
function sum(list, key){ var t = 0, any = false; list.forEach(function(x){ if (typeof x[key] === "number"){ t += x[key]; any = true; } }); return any ? t : null; }
function resLabel(v){ return String(v == null ? "" : v).replace(/_/g, " "); }
function sec(title, body){ return '<section><div class="section-title">' + title + '</div><div style="margin-top:8px">' + body + "</div></section>"; }
function safeHref(u){
  u = String(u || "");
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w.()\- \/]+$/.test(u) && u.charAt(0) !== "/" && u.indexOf("..") < 0) return "../" + encodeURI(u);
  return null;
}
function isImg(u){ return /\.(png|jpe?g|gif|webp|svg)$/i.test(String(u).replace(/[?#].*$/, "")); }
function shortUrl(u){ u = String(u).replace(/^https?:\/\/(www\.)?/, "").replace(/[?#].*$/, "").replace(/\/$/, ""); return trunc(u, 48); }
function linkOut(u, text){
  var h = safeHref(u);
  return h ? '<a href="' + esc(h) + '" target="_blank" rel="noopener noreferrer">' + esc(text || shortUrl(u)) + "</a>" : '<span class="mono">' + esc(text || u) + "</span>";
}
function webBase(){ return (D.git || {}).web || ""; }
function prLink(p){
  p = String(p); var web = webBase(), m;
  if (/^https?:/i.test(p)){ m = p.match(/\/(?:pull|merge_requests)\/(\d+)/); return linkOut(p, m ? "#" + m[1] : null); }
  m = p.match(/^([\w.-]+\/[\w.-]+)?[#!]?(\d+)$/);
  if (m && /github\.com/.test(web)) return linkOut(m[1] ? "https://github.com/" + m[1] + "/pull/" + m[2] : web + "/pull/" + m[2], (m[1] || "") + "#" + m[2]);
  if (m && !m[1] && /gitlab/.test(web)) return linkOut(web + "/-/merge_requests/" + m[2], "!" + m[2]);
  return '<span class="mono">' + esc(p) + "</span>";
}
function commitLink(c){
  c = String(c); var m = c.match(/[0-9a-f]{7,40}/i);
  if (/^https?:/i.test(c)) return linkOut(c, m ? m[0].slice(0, 7) : null);
  if (webBase() && /^[0-9a-f]{7,40}$/i.test(c)) return linkOut(webBase() + "/commit/" + c, c.slice(0, 7));
  return '<span class="mono">' + esc(c) + "</span>";
}
function repoLink(r){
  r = String(r);
  if (/^https?:/i.test(r)) return linkOut(r);
  if (/^[\w.-]+\/[\w.-]+$/.test(r) && /github\.com/.test(webBase())) return linkOut("https://github.com/" + r, r);
  return '<span class="mono">' + esc(r) + "</span>";
}
function evidenceFor(r){
  var list = (M.evidence[low(r.id)] || []).map(function(e){ return {path:e.path, label:e.label}; });
  (r.evidence || []).forEach(function(u){
    u = String(u);
    if (!list.some(function(e){ return e.path === u; })) list.push({path:u, label:/before/i.test(u) ? "before" : /after/i.test(u) ? "after" : ""});
  });
  var rank = {before:0, after:1, "":2};
  return list.sort(function(a, b){ return rank[a.label] - rank[b.label] || natural(a.path, b.path); });
}
function thumbs(list){
  return '<div class="thumbs">' + list.map(function(e){
    var h = safeHref(e.path), name = e.path.split("/").pop();
    if (!h) return "";
    if (!isImg(e.path)) return "<span>" + linkOut(e.path, name) + "</span>";
    return '<a class="thumb" href="' + esc(h) + '" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="' + esc(h) + '" alt="' + esc(name) + '" onerror="this.parentNode.classList.add(\'missing\')">' +
      "<span>" + (e.label ? '<span class="pill">' + esc(e.label) + "</span> " : "") + esc(name) + "</span></a>";
  }).join("") + "</div>";
}
function taskState(t){
  if (isDone(t)) return "done";
  if (/block/.test(t.status || "") || (t.tags || []).indexOf("blocked") >= 0) return "blocked";
  return t.status === ((M.types[t._type] || {}).statuses || [])[0] ? "todo" : "doing";
}
function depsOpen(t){ return (t.depends_on || []).map(get).filter(function(x){ return x && !isDone(x); }); }
function isReady(t){ return taskState(t) === "todo" && !depsOpen(t).length; }
function testCounts(tests){ var c = {}; tests.forEach(function(t){ c[t.status] = (c[t.status] || 0) + 1; }); return c; }
function testBar(tests){
  if (!tests.length) return "";
  var c = testCounts(tests);
  var keys = RES.filter(function(k){ return c[k]; }).concat(Object.keys(c).filter(function(k){ return RES.indexOf(k) < 0; }));
  var text = keys.map(function(k){ return c[k] + " " + resLabel(k); }).join(", ");
  return '<span class="tbar" role="img" aria-label="Tests: ' + esc(text) + '" title="' + esc(text) + '">' +
    keys.map(function(k){ return '<i class="r-' + esc(k) + '" style="flex:' + c[k] + '"></i>'; }).join("") + "</span>";
}
function testSquares(tests){
  return tests.slice().sort(byId).map(function(t){
    var text = t.id + " · " + resLabel(t.status) + " · " + t.title;
    return '<button class="sq r-' + esc(t.status) + '" data-open="' + esc(t.id) + '" title="' + esc(text) + '" aria-label="' + esc(text) + '"></button>';
  }).join("");
}
function hourBar(est, act){
  if (!est) return "";
  var p = Math.min(100, Math.round(100 * (act || 0) / est));
  return '<div class="hbar" role="img" aria-label="' + hrs(act || 0) + " of " + hrs(est) + '" title="' + hrs(act || 0) + " of " + hrs(est) + '"><i class="' + ((act || 0) > est ? "over" : "") + '" style="width:' + p + '%"></i></div>';
}
function diffCell(est, act){
  if (est == null || act == null) return "";
  var d = act - est;
  if (!d) return '<span class="muted">on estimate</span>';

  items.forEach(function(t){ by[low(t.id)] = t; });

    deps[id] = (by[id].depends_on || []).map(low).filter(function(d){ return by[d] && d !== id; });
    deps[id].forEach(function(d){ push(kids, d, id); });
  });
  var linked = Object.keys(by).filter(function(id){ return deps[id].length || (kids[id] || []).length; });
  if (!linked.length) return empty("No task here depends on another. Add a link with <code>repostate.py update T002 --add-depends T001</code>.");
  var level = {}, busy = {};
  function lv(id){
    if (level[id] != null) return level[id];
    if (busy[id]) return 0;
    busy[id] = 1; var m = 0;
    deps[id].forEach(function(d){ m = Math.max(m, lv(d) + 1); });
    busy[id] = 0; return (level[id] = m);
  }
  linked.forEach(lv);
  function weight(id){ var t = by[id]; return isDone(t) ? 0 : (typeof t.estimate_hours === "number" && t.estimate_hours > 0 ? t.estimate_hours : 1); }
  var best = {}, prev = {}, usesHours = linked.some(function(id){ return typeof by[id].estimate_hours === "number"; });
  linked.slice().sort(function(a, b){ return level[a] - level[b]; }).forEach(function(id){
    var m = 0, p = null;
    deps[id].forEach(function(d){ if ((best[d] || 0) > m){ m = best[d]; p = d; } });
    best[id] = m + weight(id); prev[id] = p;
  });
  var end = null;
  linked.forEach(function(id){ if (best[id] > 0 && (end == null || best[id] > best[end])) end = id; });
  var crit = {}, chain = [];
  for (var c = end; c; c = prev[c]){ crit[c] = 1; chain.unshift(by[c].id); }
  var cols = [], row = {};
  linked.forEach(function(id){ (cols[level[id]] = cols[level[id]] || []).push(id); });
  for (var i = 0; i < cols.length; i++){
    cols[i] = cols[i] || [];
    cols[i].sort(function(a, b){
      function avg(ds){ return ds.length ? ds.reduce(function(s2, d){ return s2 + (row[d] || 0); }, 0) / ds.length : 0; }
      return (i ? avg(deps[a]) - avg(deps[b]) : 0) || natural(a, b);
    });
    cols[i].forEach(function(id, j){ row[id] = j; });
  }
  var W = 196, H = 46, GX = 54, GY = 12, P = 6;
  var width = cols.length * (W + GX) - GX + P * 2, height = Math.max.apply(null, cols.map(function(col){ return col.length; })) * (H + GY) - GY + P * 2;
  function x(id){ return P + level[id] * (W + GX); }
  function y(id){ return P + row[id] * (H + GY); }
  var edges = "", nodes = "";
  linked.forEach(function(id){
    deps[id].forEach(function(d){
      var x1 = x(d) + W, y1 = y(d) + H / 2, x2 = x(id), y2 = y(id) + H / 2, mid = Math.max(GX / 2, (x2 - x1) / 2);
      edges += '<path class="edge' + (crit[id] && prev[id] === d ? " crit" : "") + '" d="M' + x1 + " " + y1 + " C" + (x1 + mid) + " " + y1 + "," + (x2 - mid) + " " + y2 + "," + x2 + " " + y2 + '"/>';
    });
    var t = by[id], st = taskState(t);
    nodes += '<g class="gnode s-' + st + (crit[id] ? " crit" : "") + '" data-open="' + esc(t.id) + '" tabindex="0" role="button" aria-label="' + esc(t.id + ": " + t.title + ", " + resLabel(t.status) + (crit[id] ? ", on the critical path" : "")) +
      '" transform="translate(' + x(id) + "," + y(id) + ')"><rect width="' + W + '" height="' + H + '" rx="8"/><text class="gid" x="10" y="17">' + esc(t.id) + (t.slice ? " · " + esc(t.slice) : "") + '</text><text class="gst" x="' + (W - 10) + '" y="17">' + esc(st === "blocked" ? "blocked" : resLabel(t.status)) +
      '</text><text x="10" y="35">' + esc(trunc(t.title, 28)) + "</text></g>";
  });
  var legend = [["done","Done"],["doing","In progress"],["todo","Not started"],["blocked","Blocked"]].map(function(l){
    return '<span class="row small" style="gap:5px"><span class="dot s-' + l[0] + '"></span>' + l[1] + "</span>";
  }).join("") + '<span class="row small" style="gap:5px"><svg width="26" height="8" aria-hidden="true"><path class="edge crit" d="M0 4H26"/></svg>Critical path</span><span class="small muted">A task waits on the tasks to its left.</span>';
  var alone = items.length - linked.length;
  return '<section class="panel"><h3>Critical path</h3>' + (chain.length ? '<p class="mono">' + chain.map(esc).join(" → ") + '</p><p class="small muted" style="margin-top:4px">The longest chain of unfinished work: ' +
      (usesHours ? hrs(best[end]) + " of estimates (tasks without an estimate count as 1 h)" : chain.filter(function(id){ return !isDone(get(id)); }).length + " unfinished tasks in a row") + ".</p>"
      : '<p class="muted small">Every linked task is done.</p>') + "</section>" +
    '<div class="row" style="gap:14px">' + legend + "</div>" +
    '<div class="gwrap"><svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + " " + height + '" role="group" aria-label="Task dependency graph">' + edges + nodes + "</svg></div>" +
    (alone ? '<p class="small muted">' + alone + " task(s) with no dependency links are not drawn.</p>" : "");
}
function filterSelect(type, key, all, options){
  var f = (ui.filters && ui.filters[type]) || {};
  return '<select class="input" data-filter="' + type + ":" + key + '" aria-label="Filter by ' + key + '"><option value="">' + esc(all) + "</option>" +
    options.map(function(o){ return '<option value="' + esc(o[0]) + '"' + (f[key] === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>";
}
function table(type, items, cols){
  var s = (ui.sort || {})[type];
  if (s){
    items = items.slice().sort(function(a, b){
      var x = a[s.k], y = b[s.k];
      x = Array.isArray(x) ? x.join(",") : x == null ? "" : x; y = Array.isArray(y) ? y.join(",") : y == null ? "" : y;
      var c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y));
      return s.d * c;
    });
  }
  return '<div class="table-wrap"><table><thead><tr>' + cols.map(function(c){
    var arrow = s && s.k === c[0] ? (s.d > 0 ? " ↑" : " ↓") : "";
    return '<th scope="col"><button data-sort="' + type + ":" + c[0] + '">' + esc(c[1]) + arrow + "</button></th>";
  }).join("") + "</tr></thead><tbody>" + items.map(function(r){
    return '<tr data-open="' + esc(r.id) + '" tabindex="0">' + cols.map(function(c){ return "<td>" + cell(r, c[0]) + "</td>"; }).join("") + "</tr>";
  }).join("") + "</tbody></table></div>";
}
function cell(r, k){
  var v = r[k];
  if (k === "id") return '<span class="mono">' + esc(v) + "</span>";
  if (k === "title") return esc(label(r)) + " " + privatePill(r) + " " + tagPills(r);
  if (k === "status") return statusPill(r);
  if (k === "priority") return prioPill(r);
  if (k === "goal"){ var g = get(v); return g ? esc(g.title) : esc(v || ""); }
  if (k === "task" || k === "testcase" || k === "bug") return v ? '<button class="linkish mono" data-open="' + esc(v) + '">' + esc(v) + "</button>" : "";
  if (k === "severity") return sevPill(v);
  if (k === "kind") return v ? '<span class="pill">' + esc(String(v).toUpperCase()) + "</span>" : "";
  if (k === "fix_commit") return v ? commitLink(v) : "";
  if (k === "prs") return (v || []).map(prLink).join(" ");
  if (k === "requirements") return (v || []).map(reqChip).join(" ");
  if (k === "estimate_hours" || k === "actual_hours") return v == null ? "" : hrs(v);
  if (k === "depends_on") return (v || []).map(function(id){ var x = get(id); return '<span class="mono ' + (x && isDone(x) ? "muted" : "") + '">' + esc(id) + "</span>"; }).join(" ");
  if (k === "updated_at" || k === "created_at") return '<span class="small muted">' + esc(ago(v)) + "</span>";
  if (Array.isArray(v)) return esc(v.join(", "));
  if (v && typeof v === "object") return '<span class="mono small">' + esc(JSON.stringify(v)) + "</span>";
  return esc(v);
}

  var nav = list.map(function(p){
    var lbl = pageLabel(p);
    return '<a class="nav" href="#/' + p + '"' + (p === page ? ' aria-current="page"' : "") + "><span>" + esc(lbl) + "</span>" + (p !== "overview" && counts[p] ? '<span class="count">' + counts[p] + "</span>" : "") + "</a>";
  }).join("");
  var title = page === "overview" ? name : pageLabel(page);
  var body = (views[page] || function(){ return generic(page); })();
  app.innerHTML = '<div class="app"><nav class="side" aria-label="Sections"><div class="brand"><h1>' + esc(name) + '</h1><div class="mono muted" style="margin-top:4px">' + esc(g.branch ? "⎇ " + g.branch : "") + "</div></div>" + nav +
    '<div class="side-foot small muted"><span>' + D.records.length + " records · built " + esc(ago(D.generated_at)) + "</span>" +
    '<span>Personal items are gitignored and never shared.</span><button class="btn small" data-theme-toggle>Toggle dark mode</button><button class="btn small" data-pick>Load another folder</button></div></nav>' +
    '<main class="main"><div class="top"><h2>' + esc(title) + '</h2><div class="tools">' +
    '<div class="seg" role="group" aria-label="Whose items">' + [["all","All"],["team","Team"],["personal","Personal"]].map(function(s){ return '<button data-scope="' + s[0] + '" aria-pressed="' + (ui.scope === s[0]) + '">' + s[1] + "</button>"; }).join("") + "</div>" +
    '<input class="input" type="search" placeholder="Search" aria-label="Search everything" data-search value="' + esc(ui.q) + '" style="width:220px"></div></div>' + body + "</main></div>";
  if (r.page === "item" && r.arg) openItem(r.arg);
}
function welcome(){
  return '<div class="welcome"><h1 style="font-size:24px">No data loaded yet</h1>' +
    '<p class="muted">This dashboard reads <code>.repostate/data.js</code>, which is generated and not committed. Generate it from the repo root:</p>' +
    "<pre>python3 .repostate/repostate.py build</pre><p class=\"muted\">Then reload this page. To rebuild it automatically after every pull, run:</p><pre>python3 .repostate/repostate.py hooks</pre>" +
    '<p class="muted">Or load the folder directly in this browser (nothing is uploaded):</p><div><button class="btn" data-pick>Choose the .repostate folder</button></div></div>';
}

/* ---------- loading a folder without data.js ---------- */
function loadFolder(files){
  var jobs = [], cfg = {}, local = {}, records = [];
  Array.prototype.forEach.call(files, function(f){
    var p = (f.webkitRelativePath || f.name).replace(/\\/g, "/");
    var m = p.match(/(?:^|\/)(team|personal)\/(archive\/)?([^/]+)\/([^/]+)\.json$/);
    var isCfg = /(?:^|\/)config\.json$/.test(p) && !m, isLocal = /config\.local\.json$/.test(p);
    if (!m && !isCfg && !isLocal) return;
    jobs.push(f.text().then(function(text){
      var obj; try{ obj = JSON.parse(text); }catch(e){ return; }
      if (isLocal) local = obj; else if (isCfg) cfg = obj;
      else if (obj && typeof obj === "object"){ obj._scope = m[1]; obj._archived = !!m[2]; obj._type = m[3]; obj._path = ".repostate/" + p.split("/").slice(1).join("/"); records.push(obj); }
    }));
  });
  Promise.all(jobs).then(function(){
    if (!records.length && !Object.keys(cfg).length){ alert("That folder has no repostate data. Choose the .repostate folder at the repo root."); return; }
    var merged = Object.assign({}, cfg, local, {project: Object.assign({}, cfg.project, local.project), types: Object.assign({}, cfg.types, local.types)});
    D = {config: merged, records: records, generated_at: new Date().toISOString(), git: {}};
    prepare(); render();
  });
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  if (e.target.closest("a[href]") && !e.target.closest("a[data-open]")) return;
  var el = e.target.closest("[data-open],[data-close],[data-scope],[data-view],[data-sort],[data-theme-toggle],[data-pick]");
  if (!el) return;
  if (el.hasAttribute("data-open")){ e.preventDefault(); openItem(el.getAttribute("data-open")); return; }
  if (el.hasAttribute("data-close")){ dlg.close(); return; }
  if (el.hasAttribute("data-pick")){ document.getElementById("picker").click(); return; }
  if (el.hasAttribute("data-theme-toggle")){
    var dark = document.documentElement.dataset.theme !== "dark";
    if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
    try{ localStorage.setItem("repostate.theme", dark ? "dark" : "light"); }catch(err){}
    return;
  }
  if (el.hasAttribute("data-scope")) ui.scope = el.getAttribute("data-scope");
  if (el.hasAttribute("data-view")){ var v = el.getAttribute("data-view").split(":"); ui.views = ui.views || {}; ui.views[v[0]] = v[1]; }
  if (el.hasAttribute("data-sort")){
    var s = el.getAttribute("data-sort").split(":"); ui.sort = ui.sort || {};
    var cur = ui.sort[s[0]]; ui.sort[s[0]] = {k:s[1], d: cur && cur.k === s[1] ? -cur.d : 1};
  }
  save(); render();
});
document.addEventListener("keydown", function(e){
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr[data-open],g[data-open]")){ e.preventDefault(); openItem(e.target.getAttribute("data-open")); }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "picker"){ if (t.files && t.files.length) loadFolder(t.files); return; }
  if (t.hasAttribute("data-filter")){ var f = t.getAttribute("data-filter").split(":"); ui.filters = ui.filters || {}; ui.filters[f[0]] = ui.filters[f[0]] || {}; ui.filters[f[0]][f[1]] = t.value; }
  if (t.hasAttribute("data-review-branch")) ui.reviewBranch = t.value;
  if (t.hasAttribute("data-archived")) ui.showArchived = t.checked;
  save(); render();
});
var searchTimer;
document.addEventListener("input", function(e){
  if (!e.target.hasAttribute("data-search")) return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    ui.q = e.target.value; render();
    var box = document.querySelector("[data-search]"); if (box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }, 150);
});
dlg.addEventListener("close", function(){ if (/^#\/item\//.test(location.hash)) history.replaceState(null, "", "#/overview"); });
window.addEventListener("hashchange", function(){ if (dlg.open) dlg.close(); render(); window.scrollTo(0, 0); });

if (D){ D.records = D.records || []; D.config = D.config || {}; prepare(); }
render();
})();
</script>
</body>
